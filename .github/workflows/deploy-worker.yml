name: Deploy FEDJAJ Collector

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/collector-worker.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler@3
      - name: Configure Wrangler
        run: |
          echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}" >> $GITHUB_ENV
          echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> $GITHUB_ENV
      - name: Deploy Worker
        run: |
          cd /var/minis/projects/mokhal
          npx wrangler deploy infra/collector-worker.js --name fedjaj-collector
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
